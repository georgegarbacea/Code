name: Build Windows (exe + installer)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Build folder app (for the installer)
        run: pyinstaller --noconfirm --clean packaging/lumibeat.spec

      - name: Self-test of the built exe (audio analysis, effects, Party, Art-Net, web, GUI)
        shell: pwsh
        run: |
          $exe = "dist\LumiBeat Studio\LumiBeat Studio.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","--screenshot","$PWD\selftest-gui.png" -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { Write-Error "self test failed ($($p.ExitCode))"; exit 1 }

      - name: Build portable single-file exe
        shell: pwsh
        run: |
          $env:LUMIBEAT_ONEFILE = "1"
          pyinstaller --noconfirm packaging/lumibeat.spec

      - name: Inno Setup (install if missing) + Romanian translation
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Romanian.isl" -OutFile packaging\Romanian.isl
          } catch { Write-Host "Romanian.isl unavailable, installer will be in English" }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item packaging\Output\*.exe out\
          Copy-Item "dist\LumiBeat Studio.exe" "out\LumiBeat Studio.exe"
          Compress-Archive -Path "dist\LumiBeat Studio\*" -DestinationPath "out\LumiBeat-Studio-folder.zip"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: LumiBeat-Studio-Windows
          path: out/*
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            selftest.log
            selftest-gui.png
          retention-days: 30

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
